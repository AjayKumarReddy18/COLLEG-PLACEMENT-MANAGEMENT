<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Reset Password</title>
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            font-family: Arial, Helvetica, sans-serif;
            min-height: 100vh;
            background: linear-gradient(135deg, #eef4ff 0%, #f8fbff 50%, #e8f0ff 100%);
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 30px 15px;
        }

        .reset-card {
            width: 100%;
            max-width: 520px;
            background: white;
            border-radius: 22px;
            box-shadow: 0 15px 45px rgba(30, 64, 175, 0.15);
            overflow: hidden;
        }

        .card-top {
            background: linear-gradient(135deg, #1d4ed8, #2563eb);
            color: white;
            text-align: center;
            padding: 28px 20px;
        }

        .degree-logo {
            width: 75px;
            height: 75px;
            background: white;
            color: #1d4ed8;
            border-radius: 50%;
            display: flex;
            justify-content: center;
            align-items: center;
            margin: 0 auto 12px;
            font-size: 36px;
            box-shadow: 0 8px 20px rgba(0, 0, 0, 0.15);
        }

        .card-top h2 {
            font-size: 23px;
            margin-bottom: 5px;
        }

        .card-top p {
            font-size: 14px;
            opacity: 0.9;
        }

        .card-body {
            padding: 30px;
        }

        .form-section {
            max-width: 420px;
            margin: auto;
        }

        .form-group {
            margin-bottom: 17px;
        }

        .form-group label {
            display: block;
            margin-bottom: 7px;
            color: #334155;
            font-size: 14px;
            font-weight: 700;
        }

        .form-group input {
            width: 100%;
            border: 1px solid #cbd5e1;
            border-radius: 10px;
            padding: 12px 14px;
            font-size: 15px;
            outline: none;
            background: white;
            transition: 0.2s;
        }

        .form-group input:focus {
            border-color: #2563eb;
            box-shadow: 0 0 0 3px rgba(37, 99, 235, 0.1);
        }

        .primary-button {
            width: 100%;
            border: none;
            background: linear-gradient(135deg, #1d4ed8, #2563eb);
            color: white;
            padding: 14px;
            border-radius: 10px;
            font-size: 16px;
            font-weight: 700;
            cursor: pointer;
            margin-top: 8px;
            transition: 0.2s;
        }

        .primary-button:hover {
            transform: translateY(-1px);
            box-shadow: 0 8px 18px rgba(37, 99, 235, 0.25);
        }

        .form-status {
            padding: 10px 12px;
            border-radius: 8px;
            margin-bottom: 15px;
            font-size: 14px;
            display: none;
        }

        .form-status.success {
            display: block;
            background: #ecfdf5;
            color: #065f46;
        }

        .form-status.error {
            display: block;
            background: #fef2f2;
            color: #b91c1c;
        }

        .login-links {
            text-align: center;
            margin-top: 18px;
        }

        .login-links a {
            color: #2563eb;
            text-decoration: none;
            font-weight: 700;
        }

        .login-links a:hover {
            text-decoration: underline;
        }

        .helper-text {
            color: #64748b;
            font-size: 14px;
            text-align: center;
            margin-bottom: 18px;
        }

        @media (max-width: 600px) {
            body {
                padding: 15px;
            }

            .card-body {
                padding: 20px;
            }
        }
    </style>
</head>
<body>
    <div class="reset-card">
        <div class="card-top">
            <div class="degree-logo">🎓</div>
            <h2>Reset Your Password</h2>
            <p>College Placement Portal</p>
        </div>

        <div class="card-body">
            <div class="form-section">
                <p class="helper-text">Choose a new password for your account.</p>

                <form id="reset-password-form">
                    <input type="hidden" id="reset-email" name="email" />

                    <div class="form-group">
                        <label for="reset-password">New Password</label>
                        <input type="password" id="reset-password" name="password" placeholder="Enter a new password" required />
                    </div>

                    <div class="form-group">
                        <label for="reset-password-confirm">Confirm New Password</label>
                        <input type="password" id="reset-password-confirm" name="password_confirm" placeholder="Confirm your new password" required />
                    </div>

                    <div id="reset-status" class="form-status"></div>

                    <button type="submit" class="primary-button">Reset Password</button>
                </form>

                <div class="login-links">
                    <a href="index.html" id="reset-back-login">Back to Sign In</a>
                </div>
            </div>
        </div>
    </div>

    <script src="js/script.js"></script>
</body>
</html>
