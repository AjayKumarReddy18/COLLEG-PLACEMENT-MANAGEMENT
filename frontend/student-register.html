<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Student Registration</title>

    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: Arial, sans-serif;
        }

        body {
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            background: linear-gradient(135deg, #e8f3ff, #ffffff);
        }

        .register-card {
            width: 430px;
            max-width: 92%;
            background: white;
            padding: 30px;
            border-radius: 15px;
            box-shadow: 0 15px 45px rgba(0, 0, 0, 0.15);
        }

        .logo {
            text-align: center;
            font-size: 45px;
            margin-bottom: 8px;
        }

        h1 {
            text-align: center;
            color: #123b72;
            font-size: 24px;
        }

        .subtitle {
            text-align: center;
            color: #718096;
            font-size: 12px;
            margin: 8px 0 25px;
        }

        .form-group {
            margin-bottom: 14px;
        }

        label {
            display: block;
            color: #233d60;
            font-size: 12px;
            font-weight: bold;
            margin-bottom: 6px;
        }

        input,
        select {
            width: 100%;
            height: 40px;
            border: 1px solid #cbd8e8;
            border-radius: 7px;
            padding: 0 12px;
            outline: none;
            font-size: 12px;
        }

        input:focus,
        select:focus {
            border-color: #087df5;
            box-shadow: 0 0 0 2px rgba(8, 125, 245, 0.1);
        }

        .register-btn {
            width: 100%;
            height: 42px;
            border: none;
            border-radius: 7px;
            background: #087df5;
            color: white;
            font-size: 13px;
            font-weight: bold;
            cursor: pointer;
            margin-top: 8px;
        }

        .register-btn:hover {
            background: #0569d2;
        }

        .form-status {
            margin-top: 12px;
            color: #233d60;
            font-size: 13px;
            line-height: 1.5;
        }

        .form-status.is-error { color: #b91c1c; }
        .form-status.is-success { color: #087452; }

        .back {
            display: block;
            text-align: center;
            margin-top: 16px;
            color: #087df5;
            text-decoration: none;
            font-size: 12px;
        }
    </style>
</head>

<body>

    <div class="register-card">

        <div class="logo">🎓</div>

        <h1>Student Registration</h1>

        <p class="subtitle">
            Create your College Placement account
        </p>

        <form id="student-registration-page-form">

            <div class="form-group">
                <label>Full Name</label>
                <input type="text" name="full_name" placeholder="Enter your full name" autocomplete="name" required>
            </div>

            <div class="form-group">
                <label>Email</label>
                <input type="email" name="email" placeholder="Enter your email" autocomplete="email" required>
            </div>

            <div class="form-group">
                <label>Phone Number</label>
                <input type="tel" name="phone_number" placeholder="Enter your phone number" autocomplete="tel">
            </div>

            <div class="form-group">
                <label>Department</label>

                <select name="department" required>
                    <option value="">Select department</option>
                    <option>CSE</option>
                    <option>ECE</option>
                    <option>EEE</option>
                    <option>MECH</option>
                    <option>CIVIL</option>
                    <option>Other</option>
                </select>
            </div>

            <div class="form-group">
                <label>Register Number</label>
                <input type="text" name="student_id" placeholder="Enter your register number" required>
            </div>

            <div class="form-group">
                <label>Password</label>
                <input type="password" name="password" placeholder="Create a password" autocomplete="new-password" required>

            </div>

            <div class="form-group">
                <label>Confirm Password</label>
                <input type="password" name="password_confirm" placeholder="Confirm your password" autocomplete="new-password" required>
            </div>

            <div class="form-group">
                <label>Course</label>
                <input type="text" name="course" placeholder="e.g. B.Tech" required>
            </div>

            <div class="form-group">
                <label>Year</label>
                <input type="number" name="year" min="1" required>
            </div>

            <div class="form-group">
                <label>CGPA</label>
                <input type="number" name="cgpa" min="0" max="10" step="0.01" required>
            </div>

            <div class="form-group">
                <label>Skills</label>
                <input type="text" name="skills" placeholder="e.g. Python, SQL">
            </div>

            <p class="form-status" id="student-registration-page-status" role="status" aria-live="polite"></p>

            <button type="submit" class="register-btn">
                Create Account
            </button>

        </form>

        <a href="index.html" class="back">
            ← Back to Sign In
        </a>

    </div>

    <script src="js/script.js"></script>
</body>
</html>
